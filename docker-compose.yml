version: '3.8'

services:
  proxy-socks5:
    build:
      context: .
      dockerfile: Dockerfile
    image: proxy-socks5:latest
    container_name: proxy-socks5-service
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # 可选：通过环境变量快速微调配置（优先级高于 config.json）
      # - PROXY_API_HOST=0.0.0.0
      # - PROXY_API_PORT=8899
      # - PROXY_POLL_INTERVAL=60
      # - PROXY_PROBE_TIMEOUT=1.8
      # - PROXY_PROBE_WORKERS=96
      # - PROXY_NODE_CONCURRENCY=5
      # - PROXY_DB_FILE=/app/data/data.db
    volumes:
      # 持久化存储 SQLite 数据（将保存在宿主机的 ./data 目录下）
      - ./data:/app/data
      # 如需自定义并持久化 config.json，取消下方注释
      # - ./config.json:/app/config.json
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
